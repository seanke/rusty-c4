[package]
name = "rustyc4"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.6", default-features = false }
bevy = "0.18.1"
cosmic-text = "0.16"
rfd = "0.17.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"
